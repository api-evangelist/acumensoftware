apis:
  - name: Forcelink REST API
    description: >-
      Authenticated REST surface behind the Forcelink mobile field-service ERP, served from the vendor-hosted
      za2.forcelink.net tenant alongside the Forcelink web login and the Forcelink Android/iOS apps. Every path
      under /forcelink/rest answers HTTP 401 with {"error":"No authentication method supplied"} to anonymous
      callers, including paths that do not exist, so no operation list, schema or spec is publicly observable.
      Acumen Software publishes no developer portal, API reference or machine-readable contract for it.
    humanURL: https://www.forcelink.net/
    baseURL: https://za2.forcelink.net/forcelink/rest
    tags:
      - Field Service Management
      - Workforce Management
      - Asset Management
      - ERP
      - Utilities
    tags_raw:
      - field-service-management
      - workforce-management
      - asset-management
      - enterprise-resource-planning
      - utilities
    x-access: gated
    x-access-evidence:
      - url: https://za2.forcelink.net/forcelink/rest
        status: 401
        note: '{"error":"No authentication method supplied"}'
      - url: https://za2.forcelink.net/forcelink/rest/swagger.json
        status: 401
        note: Blanket auth filter; a 401 here is not evidence a spec exists behind it.
      - url: https://za2.forcelink.net/forcelink/openapi.json
        status: 404
    properties:
      - type: Login
        url: https://za2.forcelink.net/forcelink/login
  - name: My Smart City REST API
    description: >-
      Authenticated REST surface consumed by the My Smart City citizen web app at app.mysmart.city. The web
      client's own JavaScript bundle names the base path /api/msc/rest/smartcitymanager/, and the same origin
      proxies through to the Forcelink application (an unmapped path under /api/msc returns the Forcelink
      Tomcat error page), confirming My Smart City runs on the Forcelink back end. Anonymous requests to the
      REST tree return HTTP 401; there is no public reference or spec.
    humanURL: https://www.mysmart.city/
    baseURL: https://app.mysmart.city/api/msc/rest
    tags:
      - Smart Cities
      - Local Government
      - Mobile
    tags_raw:
      - smart-cities
      - local-government
      - mobile
    x-access: gated
    x-access-evidence:
      - url: https://app.mysmart.city/api/msc/rest/
        status: 401
        note: '{"error":"No authentication method supplied"}'
      - url: https://app.mysmart.city/api/msc/v2/api-docs
        status: 404
        note: Returns the Forcelink application 404 page, evidencing the shared back end.
    properties:
      - type: Login
        url: https://app.mysmart.city/
  - name: Acumen Software Site MCP
    description: >-
      Anonymous, remote MCP endpoint served on each of the three Acumen Software marketing domains. It is the
      Wix platform's Site MCP, not a first-party Acumen or Forcelink product API — the nine tools it returns
      are Wix site/content and Wix-docs tools, advertised by the Wix-generated llms.txt on each host. It is a
      real, callable agent surface on a domain the company controls; it does not expose Forcelink or My Smart
      City data.
    humanURL: https://www.acumensoft.net/llms.txt
    baseURL: https://www.acumensoft.net/_api/mcp
    tags:
      - MCP
      - agent-native
    tags_raw:
      - mcp
      - agent-native
    properties:
      - type: MCPServer
        url: mcp/acumensoftware-mcp.yml
      - type: MCPServer
        url: https://www.acumensoft.net/_api/mcp
      - type: LLMsTxt
        url: https://www.acumensoft.net/llms.txt
