aid: acumensoftware
name: Acumen Software
description: >-
  Acumen Software is a Johannesburg, South Africa software company founded in 2006 that builds highly
  configurable mobile SaaS for work, workforce and asset management. Its flagship product Forcelink is a
  mobile field-service ERP covering work management, workforce scheduling, asset and materials management,
  fleet, project, facilities, CRM and outage management (Powerlink) for power and water utilities, telecoms,
  transport, healthcare, forestry, mining, roads, waste, local government and municipal councils. A second
  product line, My Smart City, is a citizen-engagement platform that lets residents log municipal service
  faults, book vetted service providers, submit self-meter readings and pay municipal accounts, running on
  the same Forcelink back end. Both products are delivered as hosted multi-tenant web and mobile apps; the
  underlying REST surfaces are authenticated tenant APIs with no public developer program or published
  contract.
